<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAG Control</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--bd:#e0e0e0;--ok:#0a7;--warn:#c80;--err:#c33;--p:#06c}
*{box-sizing:border-box}body{font:14px/1.45 system-ui,sans-serif;margin:0;background:var(--bg);color:var(--fg)}
header{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0}.tabs{display:flex;gap:4px;flex-wrap:wrap}button,input,select,textarea{font:inherit}
button{cursor:pointer;padding:6px 12px;border:1px solid var(--bd);background:#f5f5f5;border-radius:6px}
button.p{background:var(--p);color:#fff;border-color:var(--p)}button:disabled{opacity:.5}
.tab{padding:6px 10px;border-radius:6px;border:1px solid transparent;background:transparent}.tab.on{background:#eef;border-color:#cce}
main{padding:16px;max-width:900px;margin:0 auto}.card{border:1px solid var(--bd);border-radius:8px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.mut{color:var(--mut);font-size:12px}
label{display:block;margin:8px 0 4px;font-size:12px;color:var(--mut)}input,select,textarea{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px}
.b{font-size:11px;padding:2px 6px;border-radius:4px}.b.ok{background:#e6f7f0;color:var(--ok)}.b.warn{background:#fff5e0;color:var(--warn)}.b.err{background:#fde;color:var(--err)}
#log{font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;max-height:200px;overflow:auto;background:#f8f8f8;padding:8px;border-radius:6px}
</style></head><body>
<header><h1>RAG Control</h1><div class="tabs" id="tabs"></div></header>
<main id="main"><p class="mut">Loading… Set owner, repo and a PAT with repo scope in the Settings tab.</p></main>
<script>
/* Minimal shell so Pages deploys; full interactive UI from the original project zip can replace this file. */
const S=JSON.parse(localStorage.getItem('rag-ui')||'{}');
const tabs=['Settings','Profiles','Jobs','Webhooks'];
let tab='Settings';
function save(){localStorage.setItem('rag-ui',JSON.stringify(S))}
function $(s){return document.querySelector(s)}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
  $('#tabs').innerHTML=tabs.map(t=>`<button class="tab ${t===tab?'on':''}" data-t="${t}">${t}</button>`).join('');
  if(tab==='Settings'){
    $('#main').innerHTML=`<div class="card"><b>Repository</b>
      <label>Owner</label><input data-k="owner" value="${esc(S.owner||'')}">
      <label>Repo</label><input data-k="repo" value="${esc(S.repo||'')}">
      <label>GitHub PAT (repo scope)</label><input type="password" data-k="token" value="${esc(S.token||'')}">
      <div class="row" style="margin-top:10px"><button class="p" data-a="save">Save</button></div>
      <p class="mut">This static UI talks to the GitHub API to edit config/embeddings.json and trigger Actions. The live RAG API (FastAPI) is separate — point clients at your hosted uvicorn URL.</p></div>`;
  } else {
    $('#main').innerHTML=`<div class="card"><p class="mut">Full Profiles / Jobs / Webhooks UI is in the original <code>rag_project.zip</code>. Replace <code>ui/index.html</code> with that file for the complete experience (embedding profile editor, cron, job status, smee/Worker live feed).</p></div>`;
  }
}
document.body.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]'); if(t){tab=t.dataset.t;render()}
  if(e.target.dataset.a==='save'){
    document.querySelectorAll('[data-k]').forEach(el=>S[el.dataset.k]=el.value.trim());
    save(); alert('Saved locally');
  }
});
render();
</script></body></html>
