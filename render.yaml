# Optional: one-click deploy on Render.com free tier
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: rag-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Active LLM is xai-grok (config/llms.json)
      - key: XAI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: allanvarghese567-lab
      - key: GITHUB_REPO
        value: rag-project
      - key: GITHUB_BRANCH
        value: main
